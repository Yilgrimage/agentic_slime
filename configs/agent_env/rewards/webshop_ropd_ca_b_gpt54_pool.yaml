impl: ropd
judge_mode: aux
source: score
outcome: 10.0

ropd:
  schema_mode: ca_compact
  ca_scalar_reward_source: env_score
  require_teacher: true
  join_key: task_prompt
  teacher_index_path: ${ROOT_DIR}/data/webshop/teacher_data/trace.jsonl
  teacher_index_keys:
    - task_prompt
    - instruction
  teacher_answer_keys:
    - teacher_tool_trace
    - teacher_trace
    - teacher_full_trace_text
  concurrency: 8
  judge_concurrency: 8
  max_attempts: 4
  rate_limit_backoff_s: 10
  retry_backoff_s: 1
  response_format: json_object
  judge_max_tokens: 4096
  answer_mode: trace
  strip_reasoning: true
  strip_tool_call: 256
  strip_tool_response: 1200
  strip_assistant_response: true
  strip_system_prompt: true

credit_assignment:
  enable: true
  request_process_step_evidence: true
  advantage_mode: outcome_reweight
  beta: 0.2
  shaping_mode: milestone
  normalization: episode_turn_zscore
  milestone_reward: 2.0
  predecessor_reward: 0.5
  negative_reward: 0.0
  success_milestone_tail_steps: 1
  clip: 2.0
  step_index_base: 1
