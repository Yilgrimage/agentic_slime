impl: ropd
judge_mode: aux
source: score
outcome: 10.0

ropd:
  join_key: task_id
  teacher_index_path: ${ROOT_DIR}/data/teacher_traces/processed/webshop_official_il_teacher_tool_trace.jsonl
  teacher_index_keys:
    - task_id
    - task_index
  teacher_answer_keys:
    - teacher_trace
    - teacher_tool_trace
    - teacher_full_trace_text
  allow_online_rubric: true
  concurrency: 8
  rubric_concurrency: 4
  judge_concurrency: 4
  max_attempts: 6
  rate_limit_backoff_s: 20
  retry_backoff_s: 1
  response_format: json_object
  rubric_max_tokens: 8192
  judge_max_tokens: 8192
  answer_mode: trace
  strip_reasoning: true
  strip_tool_response: false
  strip_assistant_response: true
  strip_system_prompt: true
  reward_mode: answer_only
  reward_group_reference: students
  luffy_enable: false
  luffy_mode: off
