impl: ropd
judge_mode: aux
source: score
outcome: 10.0

ropd:
  schema_mode: rubric_shaping
  shaping_beta: 0.2
  join_key: task_id
  teacher_index_path: ${ROOT_DIR}/data/teacher_traces/processed/webshop_deepseek_v4_flash_bestofn_teacher_score1.jsonl
  teacher_index_keys:
    - task_id
  teacher_answer_keys:
    - teacher_tool_trace
    - teacher_trace
    - teacher_full_trace_text
  allow_online_rubric: true
  concurrency: 8
  rubric_concurrency: 4
  judge_concurrency: 4
  max_attempts: 6
  rate_limit_backoff_s: 20
  retry_backoff_s: 1
  response_format: json_object
  rubric_max_tokens: 8192
  judge_max_tokens: 8192
  answer_mode: trace
  strip_reasoning: true
  strip_tool_call: false
  strip_tool_response: 240
  strip_assistant_response: true
  strip_system_prompt: true
