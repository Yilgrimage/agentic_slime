impl: ropd
judge_mode: aux
source: score
outcome: 10.0

ropd:
  schema_mode: answer_process_50_50
  join_key: task_id
  teacher_index_path: ${ROOT_DIR}/data/teacher_traces/processed/appworld_deepseek_v4_flash_train_bestofn_teacher_clean_trace.jsonl
  teacher_index_keys:
    - task_id
    - task_index
  teacher_answer_keys:
    - teacher_full_trace_text
    - teacher_trace
    - teacher_response
    - teacher_answer
    - teacher_final_answer
  allow_online_rubric: true
  concurrency: 6
  rubric_concurrency: 3
  judge_concurrency: 3
  max_attempts: 6
  rate_limit_backoff_s: 30
  retry_backoff_s: 1
  response_format: json_object
  rubric_max_tokens: 32768
  judge_max_tokens: 32768
  question_max_chars: 12000
  reference_max_chars: 20000
  student_rubric_max_chars: 20000
  verifier_answer_max_chars: 20000
  answer_mode: trace
  strip_reasoning: true
  strip_tool_response: false
  strip_assistant_response: true
  strip_system_prompt: true
  reward_mode: answer_only
  reward_group_reference: students
  luffy_enable: false
  luffy_mode: off
