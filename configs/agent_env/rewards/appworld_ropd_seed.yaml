impl: ropd
judge_mode: aux
source: score
outcome: 10.0

ropd:
  schema_mode: rubric_shaping
  shaping_beta: 0.2
  join_key: task_id
  teacher_index_path: ${ROOT_DIR}/data/teacher_traces/processed/appworld_deepseek_v4_flash_train_bestofn_teacher_clean_trace.jsonl
  teacher_index_keys:
    - task_id
  teacher_answer_keys:
    - teacher_reward_trace_payload
  allow_online_rubric: true
  concurrency: 6
  rubric_concurrency: 3
  judge_concurrency: 3
  max_attempts: 6
  rate_limit_backoff_s: 30
  retry_backoff_s: 1
  response_format: json_object
  rubric_max_tokens: 32768
  judge_max_tokens: 32768
  answer_mode: trace
  strip_reasoning: true
  strip_tool_call: 512
  strip_tool_response: true
  strip_assistant_response: true
  strip_system_prompt: true
