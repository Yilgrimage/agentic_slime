eval:
  defaults:
    input_key: prompt
    metadata_key: metadata
    n_samples_per_eval_prompt: 1
    max_response_len: 4096
    temperature: 1.0
    top_p: 1.0
    top_k: -1
  datasets:
    - name: ${oc.env:APPWORLD_EVAL_DATASET_NAME}
      # Formal comparisons should use the full generated split JSONL.
      path: ${oc.env:APPWORLD_EVAL_PROMPT_DATA}
      custom_generate_function_path: examples.agent_env.appworld.rollout.generate
