task:
  split: train
max_turns: 50

prompt:
  style: official_react

timeouts:
  policy_s: 240
  env_request_s: 900

interaction:
  mode: text_action
  text_action:
    tag: code

generation:
  stop:
    - "<|im_end|>"

observation:
  include_actions: false

action:
  legacy_text_as_code: false

env_server:
  pool_size: 48
  prewarm_splits: ["train"]
  shared_pool: true
  worker_start_timeout_s: 300
  worker_request_timeout_s: 900

appworld:
  root: ${APPWORLD_ROOT}
  dataset_name: train
  eval_dataset_name: dev
  difficulty: null
  num_tasks_per_scenario: null
  only_tagged: null
  num_tasks: null
  max_interactions: 50
  max_api_calls_per_interaction: 100
  execution_timeout_s: 30
  raise_on_failure: false
  experiment_prefix: slime_agent_env
  include_api_overview: true
