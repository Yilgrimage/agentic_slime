task:
  split: train
max_turns: 20
timeouts:
  policy_s: 300
  env_request_s: 660
interaction:
  mode: tool_call
  enable_thinking: true
  reasoning:
    parser: qwen3-thinking
    fallback_to_raw: false
observation:
  include_actions: true
action:
  restrict_to_available: false
  invalid_fallback: assistant_message
reward:
  impl: legacy
  judge_mode: none
  source: score
  outcome: 10.0
  truncated: -1.0
  format:
    valid: 0.0
    invalid: -0.1
env_server:
  pool_size: 2
  acquire_timeout_s: 600
  prewarm_splits:
  - train
  shared_pool: true
  worker_start_timeout_s: 120
  worker_request_timeout_s: 300
mcp_server:
  name: mock_mcp_server
  policy: |-
    You are an agent using MCP tools. Use tool calls when information or actions
    are needed. Use the finish tool when the task is complete.
  server:
    transport: stdio
    command: python
    args:
    - -m
    - examples.agent_env.mcp_server.mock_mcp_server
    cwd: .
    env: {}
  connect_timeout_s: 30
  request_timeout_s: 120
  terminal_tools:
  - finish
  allow_assistant_final: true
  tasks:
  - id: mock-blue
    prompt: |-
      Use the lookup tool with key "color", then call finish with the answer.
    target: blue
