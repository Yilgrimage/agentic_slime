task:
  split: train
max_turns: 4
timeouts:
  policy_s: 120
  env_request_s: 180
interaction:
  mode: tool_call
  enable_thinking: true
  reasoning:
    parser: qwen3-thinking
    fallback_to_raw: false
observation:
  include_actions: true
action:
  restrict_to_available: false
  invalid_fallback: assistant_message
reward:
  impl: valleydance
  judge_mode: none
  source: score
  outcome: 10.0
  truncated: -1.0
  valleydance:
    use_llm_judge: false
  skill_usage:
    weight: 0.0
  tool_usage:
    weight: 1.0
  format:
    valid: 0.0
    invalid: -0.1
  turn:
    max_turns: 4
    excess_penalty: 0.1
env_server:
  pool_size: 2
  acquire_timeout_s: 120
  prewarm_splits:
  - train
  shared_pool: true
  worker_start_timeout_s: 180
  worker_request_timeout_s: 180
mcp_server:
  name: ipr_mcp_server_smoke
  tool_allowlist:
  - get_norm_brand
  tasks:
  - id: norm_brand_nike
    prompt: |
      Use the MCP tool get_norm_brand to normalize the raw brand name Nike.
      Then provide the final answer exactly as NIKE.
    target: NIKE
    expected_tools:
    - get_norm_brand
  policy: |
    Use MCP tools when the task asks for tool-backed information. After the tool result is enough, answer with the final result only.
  server:
    transport: psm
    psm: bytedance.mcp.machine_ipr
    mcp_gateway_region: i18n
    secret_key_path: ${ROOT_DIR}/secrets/mcp/ipr_service_account_secret_key
    env:
      PSM_SERVICE_URL_I18N: mcp.mcp.byteintl.net
      MCP_SERVER_URL_I18N: mcp.byteintl.net
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
  connect_timeout_s: 120
  request_timeout_s: 120
  terminal_tools: []
  allow_assistant_final: true
  assistant_final_success_without_target: false
