eval:
  defaults:
    input_key: prompt
    metadata_key: metadata
    n_samples_per_eval_prompt: 1
    max_response_len: 1024
    temperature: 0.0
    top_p: 1.0
    top_k: -1
  datasets:
    - name: openclaw-eval
      # OpenClaw task files define their own eval split contents.
      path: ${oc.env:OPENCLAW_EVAL_PROMPT_DATA}
      custom_generate_function_path: examples.agent_env.openclaw.rollout.generate
      metadata_overrides:
        split: eval
