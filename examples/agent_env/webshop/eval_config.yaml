eval:
  defaults:
    input_key: prompt
    metadata_key: metadata
    n_samples_per_eval_prompt: 1
    max_response_len: 512
    temperature: 0.0
    top_p: 1.0
    top_k: -1
  datasets:
    - name: webshop-valid
      # Formal eval must use the full generated split JSONL, not a lightweight
      # subset. Generate it with prompt_data.py using the intended full count.
      path: ${oc.env:WEBSHOP_VALID_PROMPT_DATA}
      custom_generate_function_path: examples.agent_env.webshop.rollout.generate
      metadata_overrides:
        split: valid
