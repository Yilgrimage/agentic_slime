task:
  split: train
max_turns: 20

timeouts:
  policy_s: 120
  env_request_s: 660

interaction:
  mode: text_action
  text_action:
    tag: action

observation:
  include_actions: true

action:
  restrict_to_available: false
  invalid_fallback: model

reward:
  impl: legacy
  judge_mode: none
  source: score
  outcome: 10.0
  format:
    valid: 0.0
    invalid: -0.1

webshop:
  env_id: WebAgentTextEnv-v0
  observation_mode: text
  data_dir: ${AGENT_ENV_DATA_DIR}
  product_file: ${AGENT_ENV_DATA_DIR}/data/items_shuffle.json
  attr_file: ${AGENT_ENV_DATA_DIR}/data/items_ins_v2.json
  num_products: 100000
  human_goals: true

env_server:
  pool_size: 48
  acquire_timeout_s: 600
  lease_ttl_s: 1800
  idempotency_ttl_s: 300
  worker_start_timeout_s: 300
  worker_request_timeout_s: 180
  prewarm_splits:
    - train
