eval:
  defaults:
    input_key: prompt
    metadata_key: metadata
    n_samples_per_eval_prompt: 1
    max_response_len: 2048
    temperature: 0.0
    top_p: 1.0
    top_k: -1
  datasets:
    - name: alfworld-valid-seen
      # Formal eval must use the full generated split JSONL, not a lightweight
      # small subset. Generate it with prompt_data.py without --num-tasks.
      path: ${oc.env:ALFWORLD_VALID_SEEN_PROMPT_DATA}
      custom_generate_function_path: examples.agent_env.alfworld.rollout.generate
      metadata_overrides:
        split: valid_seen
    - name: alfworld-valid-unseen
      path: ${oc.env:ALFWORLD_VALID_UNSEEN_PROMPT_DATA}
      custom_generate_function_path: examples.agent_env.alfworld.rollout.generate
      metadata_overrides:
        split: valid_unseen
